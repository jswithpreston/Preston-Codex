[versions]
agp             = "8.13.0"
room            = "2.8.5"
workmanager     = "2.12.0"
material        = "1.14.0"
desugar         = "2.1.5"
junit           = "4.13.2"
mockito         = "5.14.2"
robolectric     = "4.13"
gson            = "2.12.1"
androidx-test-core = "1.6.1"
androidx-test-junit = "1.2.1"

[libraries]
room-runtime        = { module = "androidx.room:room-runtime",          version.ref = "room" }
room-compiler       = { module = "androidx.room:room-compiler",         version.ref = "room" }
room-testing        = { module = "androidx.room:room-testing",          version.ref = "room" }
androidx-test-core  = { module = "androidx.test:core",                  version.ref = "androidx-test-core" }
androidx-test-junit = { module = "androidx.test.ext:junit",             version.ref = "androidx-test-junit" }
workmanager         = { module = "androidx.work:work-runtime",          version.ref = "workmanager" }
work-testing        = { module = "androidx.work:work-testing",          version.ref = "workmanager" }
material            = { module = "com.google.android.material:material", version.ref = "material" }
desugar-jdk-libs    = { module = "com.android.tools:desugar_jdk_libs",  version.ref = "desugar" }
junit               = { module = "junit:junit",                         version.ref = "junit" }
mockito-core        = { module = "org.mockito:mockito-core",            version.ref = "mockito" }
robolectric         = { module = "org.robolectric:robolectric",         version.ref = "robolectric" }
gson                = { module = "com.google.code.gson:gson",           version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
