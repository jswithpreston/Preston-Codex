name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Verify no INTERNET permission in release manifest
        run: |
          ./gradlew processReleaseManifest --quiet
          if grep -q 'android.permission.INTERNET' app/build/intermediates/merged_manifests/release/AndroidManifest.xml; then
            echo "ERROR: INTERNET permission found in release manifest" >&2
            exit 1
          fi
          echo "OK: No INTERNET permission in release manifest"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
